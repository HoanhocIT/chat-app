version: '3.8'

services:
  chat-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET:-chat-app-secret-jwt-key-2026}
      - JWT_EXPIRES_IN=7d
    env_file:
      - backend/.env
    restart: unless-stopped
